name: Preview Site

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/editorial-archive
    paths:
      - ".github/workflows/preview-pages.yml"
      - "build.py"
      - "build_editorial.py"
      - "build_memory.py"
      - "build_options.py"
      - "build_options_v2.py"
      - "build_review.py"
      - "build_pages_preview.py"
      - "audit_site.py"
      - "content/**"
      - "assets/**"
      - "presentation/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "nora-preview-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate prototype
        run: |
          python build.py
          python build_options.py
          python build_options_v2.py
          python build_review.py
          python audit_site.py
      - name: Prepare project-pages artifact
        run: python build_pages_preview.py --base-path /norasayyad.com
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
